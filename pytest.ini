[pytest]
# Collect only the tracked suite; git-ignored scratch under tmp/ must not
# break `pytest` from the repo root (the pre-push hook runs exactly that).
testpaths = tests
# Parallel by default (pytest-xdist): one worker per CPU. loadgroup keeps
# each xdist_group on one worker -- the browser tests use it (tests/conftest.py).
# Run serially with `-n 0`.
addopts = -n auto --dist loadgroup
markers =
    browser: drives real Chromium against a live server (needs playwright install chromium)
