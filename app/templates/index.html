{% extends "base.html" %}
{% block title %}Projects · Delibra{% endblock %}
{% block content %}
  <h1>Projects</h1>
  {% if projects %}
    <ul>
      {% for project in projects %}
        <li><a href="/projects/{{ project.id }}">{{ project.name }}</a><br><small>{{ project.path }}</small></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No projects registered yet.</p>
  {% endif %}
{% endblock %}
