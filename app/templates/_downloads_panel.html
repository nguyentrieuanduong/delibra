<details id="downloads-panel" class="downloads-panel"{% if awaiting_count %} open{% endif %}>
  {% include "_downloads_summary.html" %}
  <span hidden sse-swap="downloads" data-live-signal="downloads-list"></span>
  {# queue last: a change during a refresh still gets a refresh after it. #}
  <span hidden id="downloads-refresh" hx-get="{{ project_url(project.name, '/downloads/list') }}"
        hx-trigger="downloads-changed" hx-sync="this:queue last"
        hx-target="#downloads-list" hx-swap="outerHTML"></span>
  {% include "_downloads_list.html" %}
</details>
