<form
  id="chat-composer"
  method="post"
  action="/projects/{{ project.id }}/chat/run"
  hx-post="/projects/{{ project.id }}/chat/run"
  hx-target=".chat-timeline"
  hx-swap="beforeend"
  {% if composer_oob %}hx-swap-oob="outerHTML:#chat-composer"{% endif %}
>
  {% if selected_session %}
    <input type="hidden" name="session_id" value="{{ selected_session.id }}">
    <p class="composer-agent-meta">
      Sending as {{ selected_session.name }} · {{ selected_session.agent }} · {{ selected_session.model }} · {{ selected_session.effort }}
    </p>
  {% endif %}
  <label>Message
    <textarea name="prompt" maxlength="100000" required{% if not selected_session %} disabled{% endif %}></textarea>
  </label>
  <button type="submit"{% if not selected_session %} disabled{% endif %}>Send</button>
</form>
