<form
  id="chat-composer"
  method="post"
  action="{{ project_url(project.name, '/chat/run') }}"
  hx-post="{{ project_url(project.name, '/chat/run') }}"
  hx-target=".chat-timeline"
  hx-swap="beforeend"
  data-session-id="{{ selected_session.id if selected_session else '' }}"
  {% if composer_oob %}hx-swap-oob="outerHTML:#chat-composer"{% endif %}
>
  {% if selected_session %}
    <input type="hidden" name="session_id" value="{{ selected_session.id }}">
  {% endif %}
  <div class="composer-field">
    {# One line: the box's name, then who it sends as, which describes it. #}
    <div class="composer-heading">
      <label for="chat-composer-prompt">Message</label>
      {% if selected_session %}
        <span id="composer-agent" class="composer-agent-meta">
          sending as {{ selected_session.name }} · {{ selected_session.agent }} · {{ selected_session.model }} · {{ selected_session.effort }}
        </span>
      {% endif %}
    </div>
    <textarea name="prompt" id="chat-composer-prompt" maxlength="100000" required data-composer-send{% if selected_session %} aria-describedby="composer-agent"{% endif %}{% if not selected_session or auto_active or selected_session.status == 'running' %} disabled{% endif %}></textarea>
  </div>
  <div class="composer-actions">
    <button
      type="submit"
      data-composer-send
      {% if not selected_session or auto_active or selected_session.status == 'running' %}disabled{% endif %}
    >Send</button>
    <button
      type="button"
      data-auto-open
      data-disable-during-auto
      hx-get="{{ project_url(project.name, '/auto/setup') }}"
      hx-target="#auto-setup-host"
      hx-swap="innerHTML"
      {% if auto_active or sessions|length < 2 %}disabled{% endif %}
      {% if auto_active %}data-auto-disabled="true"{% endif %}
    >Auto</button>
  </div>
</form>
