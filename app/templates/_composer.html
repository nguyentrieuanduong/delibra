<form
  id="chat-composer"
  method="post"
  action="/projects/{{ project.id }}/chat/run"
  hx-post="/projects/{{ project.id }}/chat/run"
  hx-target=".chat-timeline"
  hx-swap="beforeend"
  {% if composer_oob %}hx-swap-oob="outerHTML:#chat-composer"{% endif %}
>
  {% if selected_session %}
    <input type="hidden" name="session_id" value="{{ selected_session.id }}">
    <p class="composer-agent-meta">
      Sending as {{ selected_session.name }} · {{ selected_session.agent }} · {{ selected_session.model }} · {{ selected_session.effort }}
    </p>
  {% endif %}
  <label>Message
    <textarea name="prompt" maxlength="100000" required{% if not selected_session or auto_active %} disabled{% endif %}{% if auto_active %} data-auto-disabled="true"{% endif %}></textarea>
  </label>
  <div class="composer-actions">
    <button
      type="submit"
      data-disable-during-auto
      {% if not selected_session or auto_active %}disabled{% endif %}
      {% if auto_active %}data-auto-disabled="true"{% endif %}
    >Send</button>
    <button
      type="button"
      data-auto-open
      data-disable-during-auto
      hx-get="/projects/{{ project.id }}/auto/setup"
      hx-target="#auto-setup-host"
      hx-swap="innerHTML"
      {% if auto_active or sessions|length < 2 %}disabled{% endif %}
      {% if auto_active %}data-auto-disabled="true"{% endif %}
    >Auto</button>
  </div>
</form>
