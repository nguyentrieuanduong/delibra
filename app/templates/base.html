<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Delibra{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/sse.js" defer></script>
  </head>
  <body>
    <header><a href="/">Delibra</a></header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      {% for provider in health %}
        <span class="health {{ 'warning' if provider.warning else 'ok' }}">
          {{ provider.warning or (provider.name|title ~ ' ' ~ provider.version) }}
        </span>
      {% endfor %}
    </footer>
  </body>
</html>
