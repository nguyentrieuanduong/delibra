{% from "_form_macros.html" import effort_options %}
<aside
  id="agent-sidebar"
  aria-label="Agents"
>
  <h2>Agents</h2>
  <details{% if not sessions %} open{% endif %}>
    <summary>Create agent</summary>
    <form
      method="post"
      action="{{ project_url(project.name, '/sessions') }}"
      hx-post="{{ project_url(project.name, '/sessions') }}"
      hx-target="#agent-sidebar"
      hx-swap="outerHTML"
      data-session-config-form
      data-agent="claude"
    >
      <label>Name
        <input name="name" maxlength="200" required>
        <small>
          Up to 200 UTF-8 bytes; non-ASCII characters may use multiple bytes.
        </small>
      </label>
      <label>Agent
        <select name="agent" required data-agent-select>
          <option value="claude">Claude</option>
          <option value="codex">Codex</option>
        </select>
      </label>
      <label>Model <input name="model" maxlength="200" value="sonnet" required></label>
      <label>Effort
        <select name="effort" required data-effort-select>
          {{ effort_options(effort_levels, 'claude', 'high') }}
        </select>
      </label>
      <label>Role instructions
        <textarea name="role_instructions" maxlength="20000"></textarea>
      </label>
      <button type="submit" data-disable-during-auto{% if auto_active %} disabled data-auto-disabled="true"{% endif %}>Create agent</button>
    </form>
  </details>
  <div class="agent-cards">
    {% for agent_view in agent_views %}
      {% include "_agent_card.html" %}
    {% else %}
      <p>No agents yet. Create an agent to begin.</p>
    {% endfor %}
  </div>
</aside>
{% if composer_oob %}{% include "_composer.html" %}{% endif %}
