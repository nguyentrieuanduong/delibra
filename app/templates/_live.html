<section
  class="live-round"
  id="{{ dom_id }}"
  hx-ext="sse"
  sse-connect="/projects/{{ key.project_id }}/sessions/{{ key.session_id }}/rounds/{{ key.round_n }}/stream"
>
  <h2>{{ session.name }} · Round {{ key.round_n }} · running</h2>
  <div
    class="timeout-host"
    hx-get="/projects/{{ key.project_id }}/sessions/{{ key.session_id }}/rounds/{{ key.round_n }}/timeout"
    hx-trigger="load, sse:timeout_extended, timeout-refresh from:body"
    hx-target="this"
    hx-swap="innerHTML"
  ></div>
  <pre class="live-text" sse-swap="text_delta,snapshot" hx-swap="beforeend"></pre>
  <div class="live-progress" sse-swap="progress" hx-swap="beforeend"></div>
  <span class="live-reset" sse-swap="reset" hx-swap="none" hidden></span>
  <button
    type="button"
    hx-post="/projects/{{ key.project_id }}/sessions/{{ key.session_id }}/cancel"
    hx-target="#{{ dom_id }}"
    hx-swap="none"
  >Cancel</button>
  <span
    hx-get="/projects/{{ key.project_id }}/sessions/{{ key.session_id }}/rounds/{{ key.round_n }}{% if chat_view %}?view=chat{% endif %}"
    hx-trigger="sse:done once"
    hx-target="#{{ dom_id }}"
    hx-swap="outerHTML"
  ></span>
</section>
