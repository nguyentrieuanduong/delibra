<section
  class="live-round"
  id="{{ dom_id }}"
  hx-preserve="true"
  hx-ext="sse"
  sse-connect="{{ project_url(project.name, '/sessions/' ~ key.session_id ~ '/rounds/' ~ key.round_n ~ '/stream') }}"
>
  <h2>
    {{ session.name }} · Round {{ key.round_n }} · running
    {% if round is defined and round.record and round.record.auto %}
      · {% if round.auto_url %}
          <a href="{{ round.auto_url }}">Auto {{ round.auto_number }}</a>
        {% else %}
          <span>Auto</span>
        {% endif %}
    {% endif %}
  </h2>
  <div
    class="timeout-host"
    hx-get="{{ project_url(project.name, '/sessions/' ~ key.session_id ~ '/rounds/' ~ key.round_n ~ '/timeout') }}"
    hx-trigger="load, sse:timeout_extended, timeout-refresh from:body"
    hx-target="this"
    hx-swap="innerHTML"
  ></div>
  <pre class="live-text" sse-swap="text_delta,snapshot" hx-swap="beforeend"></pre>
  <div class="live-progress" sse-swap="progress" hx-swap="beforeend"></div>
  <span class="live-reset" sse-swap="reset" hx-swap="none" hidden></span>
  <button
    type="button"
    data-disable-during-auto
    hx-post="{{ project_url(project.name, '/sessions/' ~ key.session_id ~ '/cancel') }}"
    hx-target="#{{ dom_id }}"
    hx-swap="none"
    {% if auto_active %}disabled data-auto-disabled="true"{% endif %}
  >Cancel</button>
  <span
    hx-get="{{ project_url(project.name, '/sessions/' ~ key.session_id ~ '/rounds/' ~ key.round_n ~ ('?view=chat' if chat_view else '')) }}"
    hx-trigger="sse:done once"
    hx-target="#{{ dom_id }}"
    hx-swap="outerHTML"
  ></span>
</section>
