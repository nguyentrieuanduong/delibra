<article class="round {{ round.record.status if round.record else 'orphan' }}{% if round.record and round.record.auto %} auto-{{ round.record.auto.phase }}{% endif %}" id="{{ round.dom_id }}">
  <div class="round-header">
    <h2>{{ session.name }} · Round {{ round.n }}{% if round.orphan %} · orphaned files{% endif %}</h2>
    {% if chat_view and round.record %}
      <button
        type="button"
        class="focus-round"
        aria-haspopup="dialog"
        hx-get="{{ project_url(project.id, '/sessions/' ~ session_id ~ '/rounds/' ~ round.n ~ '/focus') }}"
        hx-target="#focus-dialog-content"
        hx-swap="innerHTML"
      >Focus</button>
    {% endif %}
  </div>
  {% if chat_view %}
    <details{% if round_expanded %} open{% endif %} class="round-details">
      <summary>Message contents</summary>
      {% include "_round_contents.html" %}
    </details>
  {% else %}
    {% include "_round_contents.html" %}
  {% endif %}
</article>
